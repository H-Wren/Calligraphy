version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calligraphy-api
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - MAX_IMAGE_SIZE=10
      - OCR_LANG=ch
    restart: unless-stopped

volumes:
  uploads:
